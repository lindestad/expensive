[package]
name = "expensive"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
license = "MIT"
description = "Terminal dashboard for OpenCode token usage and spend"
repository = "https://github.com/lindestad/expensive"
homepage = "https://github.com/lindestad/expensive"
documentation = "https://docs.rs/expensive"
readme = "README.md"
keywords = ["opencode", "tui", "tokens", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
